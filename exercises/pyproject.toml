# One Python environment for ALL Python exercises in this handbook.
#
#   cd exercises
#   uv sync                 # creates .venv and installs pytest
#   uv run pytest <folder>  # runs one exercise's checks
#
# Later modules add groups (flask, fastapi, ai…) so you only install what you need.
[project]
name = "fsse-exercises"
version = "0.1.0"
description = "Local exercises for the FSSE Handbook"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "psycopg[binary]>=3.2",
    "mypy>=2.3.1",
    "flask>=3.1",
    "flask-sqlalchemy>=3.1",
    "flask-migrate>=4.1",
    "sqlalchemy>=2.0",
    "marshmallow>=4",
    "flask-smorest>=0.46",
    "flask-jwt-extended>=4.7",
    "gunicorn>=23",
    "pyyaml>=6",
    "locust>=2.30",
    "redis>=6",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
# Each exercise folder has its own uniquely named module (e.g. word_count.py),
# so tests can simply `from word_count import ...`.
python_files = ["test_*.py"]
norecursedirs = [".venv", "solution", "__pycache__", ".check-tmp", ".grader-tmp", "practice", "conflict-lab"]
addopts = "-q"
