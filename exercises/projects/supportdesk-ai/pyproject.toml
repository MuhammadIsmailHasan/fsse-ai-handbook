[project]
name = "supportdesk-api"
version = "0.1.0"
description = "SupportDesk AI — help-desk assistant API (RAG, tools, guardrails, handoff)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pyjwt>=2.10",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.28",
    "ruff>=0.12",
    "mypy>=1.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
