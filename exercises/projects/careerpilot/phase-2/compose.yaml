# Local development database for CareerPilot (port 5492, so it doesn't clash with other Postgres instances).
#   docker compose up -d
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: careerpilot
      POSTGRES_PASSWORD: careerpilot
      POSTGRES_DB: careerpilot
    ports:
      - "${POSTGRES_PORT:-5492}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerpilot -d careerpilot"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
