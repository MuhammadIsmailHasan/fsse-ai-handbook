# Local services for exercises. Start: docker compose up -d   Stop: docker compose down
# Credentials here are for LOCAL PRACTICE ONLY — never reuse them anywhere real.
services:
  db:
    image: postgres:17-alpine
    container_name: fsse-exercises-db
    environment:
      POSTGRES_USER: fsse
      POSTGRES_PASSWORD: fsse
      POSTGRES_DB: fsse
    ports:
      - "${POSTGRES_PORT:-5491}:5432"
    volumes:
      - fsse-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsse -d fsse"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: fsse-exercises-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]   # practice data only: no persistence
    ports:
      - "${REDIS_PORT:-6391}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  fsse-pgdata:
